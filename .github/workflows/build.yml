name: Build Fabric 1.21 port

on:
  push:
    branches:
      - fabric-1.21-port
  pull_request:
    branches:
      - fabric-1.21-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # Temporary CI artifact only. This is not a public release.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyblockqol-fabric-1.21
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
