name: Build Fabric 1.21

on:
  push:
    branches: [fabric-1.21-port]
  pull_request:
    branches: [fabric-1.21-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Verify JAR is a genuine Fabric 1.21 mod
        run: |
          JAR=build/libs/aetheria-fabric-1.21.jar
          ls -l build/libs
          test -f "$JAR" || { echo "Missing $JAR"; exit 1; }
          unzip -l "$JAR" | grep -q 'fabric.mod.json' || { echo "No fabric.mod.json"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/aetheria/AetheriaClient.class' || { echo "No client entrypoint"; exit 1; }
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": "1.21"' || { echo "Wrong MC dependency"; exit 1; }
          if unzip -l "$JAR" | grep -Eq 'mcmod.info|net/minecraftforge|cpw/mods'; then
            echo "Forge content found in JAR"; exit 1
          fi
          echo "OK: Fabric JAR verified"

      - name: Upload Fabric JAR only
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-fabric-1.21
          path: build/libs/aetheria-fabric-1.21.jar
          if-no-files-found: error
