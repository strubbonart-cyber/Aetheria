name: Build Skyblock QoL Fabric Port 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - fabric-1.21-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 25 for Gradle and Loom
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper line endings
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build mod with Java 21 bytecode compatibility
        run: ./gradlew clean build --no-daemon

      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: skyblock-qol-fabric-port-1.21.11
          path: build/libs/skyblock-qol-fabric-port-1.21.11-1.0.0-fabric-1.21.11.jar
          if-no-files-found: error
          retention-days: 7
